# Builds, tests and packages SackSpace on GitHub. Once the SignPath project exists
# (repository variable SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN), the exe
# is signed before it goes into the wizard, and then the wizard itself is signed.
# A v* tag also creates a draft Release with the signed wizard.
name: Compilar y firmar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the draft Release on tags

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT: sackspace
      SIGNPATH_POLICY: test-signing # shortcut: switch v* tags to release-signing once SignPath Foundation approves
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pruebas y exe
        shell: pwsh
        run: ./publish.ps1 -NoInstaller

      # Signing goes straight to the SignPath REST API (PowerShell module), not through the
      # GitHub connector: the connector needs the predefined GitHub.com trusted build system,
      # which the free trial does not offer. The artifact configurations expect a zip.
      - name: Modulo de SignPath
        if: env.SIGN == 'true'
        shell: pwsh
        run: Install-Module SignPath -Force -Scope CurrentUser

      - name: Firmar el exe (SignPath)
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: ./sign.ps1 -File dist/SackSpace.exe -Configuration exe

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Instalador
        shell: pwsh
        run: ./publish.ps1 -InstallerOnly

      - name: Firmar el instalador (SignPath)
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: ./sign.ps1 -File (Get-ChildItem dist -Filter 'SackSpace-Setup-*.exe' | Select-Object -First 1).FullName -Configuration installer

      - name: Subir el instalador final
        uses: actions/upload-artifact@v4
        with:
          name: SackSpace
          path: dist/SackSpace-Setup-*.exe
          if-no-files-found: error

      - name: Borrador de la Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist -Filter 'SackSpace-Setup-*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          gh release create $env:GITHUB_REF_NAME $setup.FullName --draft --title "SackSpace $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "SHA-256 del instalador: ``$hash``"
